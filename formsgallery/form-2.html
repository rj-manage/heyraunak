<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>02 · Modern Minimal — Rj_Manage</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/common.css" />
  <style>
    body { background: #0f172a; }
    .section { padding: 80px 20px; }

    .wrap { max-width: 720px; margin: 0 auto; text-align: center; }
    .wrap h2 { color: #f8fafc; font-size: clamp(24px, 4vw, 34px); letter-spacing: -.02em; }
    .wrap .lede { color: #94a3b8; font-size: 15px; margin-top: 10px; }

    .card {
      background: #fff; border-radius: 22px; margin-top: 40px;
      padding: 46px 50px 50px; text-align: left;
      box-shadow: 0 30px 80px -30px rgba(0,0,0,.55);
    }
    @media (max-width: 560px) { .card { padding: 30px 24px; } }

    .float-field { position: relative; margin-bottom: 26px; }
    .float-field input, .float-field textarea, .float-field select {
      width: 100%; padding: 20px 16px 8px; border: 1.5px solid #e2e8f0; border-radius: 12px;
      font: inherit; font-size: 15px; color: #0f172a; background: #fff; outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .float-field textarea { min-height: 110px; resize: vertical; }
    .float-field label {
      position: absolute; left: 16px; top: 15px; font-size: 15px; color: #94a3b8;
      pointer-events: none; transition: all .18s ease; background: transparent; padding: 0 4px;
    }
    .float-field input:focus, .float-field textarea:focus, .float-field select:focus {
      border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,.14);
    }
    .float-field input:focus + label, .float-field input:not(:placeholder-shown) + label,
    .float-field textarea:focus + label, .float-field textarea:not(:placeholder-shown) + label,
    .float-field select:focus + label, .float-field select:has(option:checked:not(:first-child)) + label {
      top: 6px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #6366f1;
    }
    .float-field select:not(:focus):has(option:checked:not(:first-child)) { padding-top: 20px; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
    @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }

    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 30px; }
    .chip {
      border: 1.5px solid #e2e8f0; background: #fff; color: #475569;
      padding: 10px 16px; border-radius: 999px; font: inherit; font-size: 13.5px; font-weight: 600;
      cursor: pointer; transition: all .18s ease;
    }
    .chip.selected { background: #eef2ff; border-color: #6366f1; color: #4338ca; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }

    .btn-primary { width: 100%; padding: 15px; border-radius: 12px; font-size: 15.5px; }
    .fine { text-align: center; color: #94a3b8; font-size: 12.5px; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="toast"></div>
  <section class="section">
    <div class="wrap">
      <h2>Create your account</h2>
      <p class="lede">Modern minimal signup — just the essentials, beautifully arranged.</p>
      <div class="card">
        <form id="signForm" novalidate>
          <div class="grid2">
            <div class="float-field">
              <input id="fname" type="text" placeholder=" " required data-field="First Name" />
              <label for="fname">First name</label>
            </div>
            <div class="float-field">
              <input id="lname" type="text" placeholder=" " required data-field="Last Name" />
              <label for="lname">Last name</label>
            </div>
          </div>
          <div class="grid2">
            <div class="float-field">
              <select id="country" required data-field="Country">
                <option value="" selected></option>
                <option>India</option>
                <option>United States</option>
                <option>United Kingdom</option>
                <option>Germany</option>
                <option>Australia</option>
                <option>Canada</option>
              </select>
              <label for="country">Country</label>
            </div>
            <div class="float-field">
              <select id="plan" required data-field="Plan">
                <option value="" selected></option>
                <option>Free</option>
                <option>Starter</option>
                <option>Pro</option>
                <option>Enterprise</option>
              </select>
              <label for="plan">Plan</label>
            </div>
          </div>
          <p style="font-size:13.5px;font-weight:600;color:#475569;margin-bottom:4px;">How did you hear about us?</p>
          <div class="chip-row" id="chips">
            <button type="button" class="chip" data-chip>Search</button>
            <button type="button" class="chip" data-chip>Referral</button>
            <button type="button" class="chip" data-chip>Social media</button>
            <button type="button" class="chip" data-chip>Podcast</button>
          </div>
          <div class="float-field">
            <textarea id="note" placeholder=" " required data-field="Note"></textarea>
            <label for="note">Anything else we should know?</label>
          </div>
          <button class="btn btn-primary" type="submit">Create account →</button>
          <p class="fine">Takes under a minute · you can change your plan later</p>
        </form>
      </div>
    </div>
  </section>

  <script src="js/common.js"></script>
  <script>
    const chips = document.querySelectorAll("[data-chip]");
    chips.forEach((c) => c.addEventListener("click", () => {
      chips.forEach((x) => x.classList.remove("selected"));
      c.classList.add("selected");
    }));

    document.getElementById("signForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target;
      if (!form.checkValidity()) { form.reportValidity(); return; }
      const d = collectForm(form);
      const src = document.querySelector("[data-chip].selected");
      showToast("✅ Account created for " + d["First Name"] + (src ? " · via " + src.textContent : ""));
      form.reset();
      chips.forEach((x) => x.classList.remove("selected"));
    });
  </script>
</body>
</html>
