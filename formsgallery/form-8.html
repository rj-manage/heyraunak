<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>08 · 3D Tilt Card — Rj_Manage</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/common.css" />
  <style>
    body { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 45%, #6d28d9 100%); min-height: 100vh; }
    .section { padding: 70px 20px; }

    .head { text-align: center; color: #ede9fe; margin-bottom: 34px; }
    .head h2 { font-size: clamp(26px, 4vw, 38px); letter-spacing: -.02em; }
    .head p { color: #c4b5fd; margin-top: 8px; font-size: 15px; }
    .head .hint-chip { display: inline-block; margin-top: 14px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #a78bfa; border: 1px solid rgba(167,139,250,.4); padding: 6px 14px; border-radius: 999px; }

    .scene { perspective: 1400px; max-width: 760px; margin: 0 auto; }
    .tilt-card {
      position: relative; transform-style: preserve-3d; will-change: transform;
      transition: transform .12s ease-out;
      border-radius: 26px;
      background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
      border: 1px solid rgba(255,255,255,.3);
      box-shadow: 0 40px 90px -30px rgba(0,0,0,.6);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      padding: 46px 50px;
    }
    @media (max-width: 560px) { .tilt-card { padding: 32px 22px; } }

    .glare {
      position: absolute; inset: 0; border-radius: 26px; pointer-events: none; z-index: 3;
      background: radial-gradient(420px 260px at var(--gx, 50%) var(--gy, 50%), rgba(255,255,255,.22), transparent 65%);
      opacity: 0; transition: opacity .2s ease;
    }
    .tilt-card:hover .glare { opacity: 1; }

    .inner { transform: translateZ(46px); }
    .inner h3 { color: #fff; font-size: 23px; letter-spacing: -.01em; margin-bottom: 4px; }
    .inner .sub { color: rgba(226, 232, 240, .75); font-size: 14px; margin-bottom: 26px; }
    .inner form { display: grid; gap: 16px; }

    .t-field label { display: block; font-size: 13px; font-weight: 600; color: rgba(226,232,240,.8); margin-bottom: 7px; }
    .t-field input, .t-field select, .t-field textarea {
      width: 100%; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.22);
      color: #fff; font: inherit; font-size: 14.5px; padding: 13px 15px; border-radius: 12px; outline: none; resize: vertical;
      transition: all .2s ease;
    }
    .t-field textarea { min-height: 90px; }
    .t-field input::placeholder, .t-field textarea::placeholder { color: rgba(226,232,240,.4); }
    .t-field select option { background: #312e81; color: #fff; }
    .t-field input:focus, .t-field select:focus, .t-field textarea:focus {
      background: rgba(255,255,255,.14); border-color: rgba(196,181,253,.85);
      box-shadow: 0 0 0 4px rgba(139,92,246,.28);
    }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 500px) { .row { grid-template-columns: 1fr; } }

    .tilt-btn {
      background: #fff; color: #4c1d95; font: inherit; font-weight: 800; font-size: 15px;
      border: none; border-radius: 12px; padding: 15px; cursor: pointer;
      box-shadow: 0 14px 34px -12px rgba(0,0,0,.5);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .tilt-btn:hover { transform: translateY(-2px); box-shadow: 0 20px 44px -12px rgba(0,0,0,.6); }
    .fine { text-align: center; color: rgba(226,232,240,.55); font-size: 12.5px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="toast"></div>
  <section class="section">
    <div class="head">
      <h2>Event RSVP Card</h2>
      <p>Move your cursor — the card follows with real depth.</p>
      <span class="hint-chip">← tilt me →</span>
    </div>

    <div class="scene">
      <div class="tilt-card" id="tiltCard">
        <div class="glare" id="glare"></div>
        <div class="inner">
          <h3>Reserve your seat</h3>
          <p class="sub">Rj_Manage · Design Summit 2026 — RSVP in 3D.</p>
          <form id="rsvpForm" novalidate>
            <div class="row">
              <div class="t-field">
                <label for="name">Your name *</label>
                <input id="name" type="text" placeholder="e.g. Dev Patel" required data-field="Name" />
              </div>
              <div class="t-field">
                <label for="ticket">Ticket *</label>
                <select id="ticket" required data-field="Ticket">
                  <option value="">Choose…</option>
                  <option>General Admission</option>
                  <option>VIP</option>
                  <option>Speaker</option>
                  <option>Virtual</option>
                </select>
              </div>
            </div>
            <div class="t-field">
              <label for="day">Day *</label>
              <select id="day" required data-field="Day">
                <option value="">Select…</option>
                <option>Day 1 — Talks</option>
                <option>Day 2 — Workshops</option>
                <option>Both days</option>
              </select>
            </div>
            <div class="t-field">
              <label for="reason">Dietary / notes *</label>
              <textarea id="reason" placeholder="Anything we should know…" required data-field="Notes"></textarea>
            </div>
            <button class="tilt-btn" type="submit">Confirm RSVP</button>
            <p class="fine">Hover the card and watch the parallax depth follow your cursor.</p>
          </form>
        </div>
      </div>
    </div>
  </section>

  <script src="js/common.js"></script>
  <script>
    const card = document.getElementById("tiltCard");
    const glare = document.getElementById("glare");

    card.addEventListener("mousemove", (e) => {
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;
      const rx = (0.5 - py) * 14;
      const ry = (px - 0.5) * 16;
      card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
      glare.style.setProperty("--gx", `${px * 100}%`);
      glare.style.setProperty("--gy", `${py * 100}%`);
    });

    card.addEventListener("mouseleave", () => {
      card.style.transform = "rotateX(0deg) rotateY(0deg)";
    });

    document.getElementById("rsvpForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target;
      if (!form.checkValidity()) { form.reportValidity(); return; }
      const d = collectForm(form);
      showToast("✅ RSVP confirmed for " + d["Name"] + " — " + d["Ticket"]);
      form.reset();
    });
  </script>
</body>
</html>
